name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify modules
        run: |
          GOWORK=off go mod download
          GOWORK=off go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Test
        run: GOWORK=off go test -mod=readonly -count=1 -short ./...
      - name: Vet
        run: GOWORK=off go vet -mod=readonly ./...
      - name: Release contract
        run: GOWORK=off go test -mod=readonly -run '^TestRelease' ./...
      - name: Windows compile
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 GOWORK=off go test -mod=readonly -run '^$' -exec=true ./...
      - name: MCP policy demo
        run: GOWORK=off go run -mod=readonly ./cmd/snapref demo mcp-policy

  self-test:
    name: live self-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNAPREF_HOME: ${{ github.workspace }}/.snapref-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Allow Chrome sandbox user namespaces
        # Ubuntu 24.04 runners restrict unprivileged user namespaces through
        # AppArmor. Chrome for Testing has no AppArmor profile, so its sandbox
        # exits before publishing DevToolsActivePort. Relax the runner, not
        # SnapRef: the browser keeps its sandbox enabled.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Chrome for Testing
        run: GOWORK=off go run -mod=readonly ./cmd/snapref runtime install --runtime chrome-for-testing --channel stable
      - name: Self-test
        env:
          SNAPREF_DEBUG: "1"
        run: GOWORK=off go run -mod=readonly ./cmd/snapref self-test --runtime chrome-for-testing --json
      - name: Ref-integrity demo
        run: GOWORK=off go run -mod=readonly ./cmd/snapref demo ref-integrity --runtime chrome-for-testing

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
      - name: Secret scan
        run: /tmp/gitleaks git . --redact --no-banner
